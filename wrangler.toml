# Static Astro site — do not auto-add @astrojs/cloudflare (keeps output in dist/).
# Production hostname: https://hacksvalorant.com (www and http redirect in the worker).
name = "hacksvalorant-com"
main = "worker/canonical-host.mjs"
compatibility_date = "2025-10-11"
workers_dev = true

# Cloudflare CI runs `npx wrangler deploy` only; this produces dist/ before upload.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "none"
# Attach hacksvalorant.com to this Worker. In the zone, set Always Use HTTPS and www → apex.
